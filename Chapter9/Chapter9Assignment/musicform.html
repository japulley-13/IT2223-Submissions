<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Music Survey Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2f3;
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: #333333;
    }

    form {
      width: 750px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 20px;
      border: 1px solid #cccccc;
      border-radius: 8px;
    }

    label {
      display: inline-block;
      width: 220px;
      vertical-align: top;
      margin-bottom: 10px;
    }

    input, select, textarea {
      margin-bottom: 12px;
    }

    fieldset {
      margin-top: 15px;
      margin-bottom: 15px;
      padding: 15px;
      border: 1px solid #999999;
    }

    legend {
      font-weight: bold;
    }

    .checkbox-group label,
    .radio-group label {
      display: block;
      width: auto;
      margin-bottom: 5px;
    }

    .buttons {
      text-align: center;
      margin-top: 20px;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #003366;
      text-decoration: none;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 0.95em;
      color: #333333;
    }
  </style>
</head>
<body>

  <h1>Music Survey</h1>

  <form method="post" action="https://webdevbasics.net/scripts/demo.php">

    <label for="name">Name:</label>
    <input type="text" name="name" id="name"><br>

    <label for="email">E-mail:</label>
    <input type="email" name="email" id="email"><br>

    <fieldset>
      <legend>Select Your Favorite Types of Music</legend>
      <div class="checkbox-group">
        <input type="checkbox" name="musictype" id="pop" value="Pop">
        <label for="pop">Pop</label>

        <input type="checkbox" name="musictype" id="rock" value="Rock">
        <label for="rock">Rock</label>

        <input type="checkbox" name="musictype" id="country" value="Country">
        <label for="country">Country</label>

        <input type="checkbox" name="musictype" id="rap" value="Rap">
        <label for="rap">Rap</label>

        <input type="checkbox" name="musictype" id="jazz" value="Jazz">
        <label for="jazz">Jazz</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Select How Often You Listen to Music</legend>
      <div class="radio-group">
        <input type="radio" name="frequency" id="daily" value="Daily">
        <label for="daily">Daily</label>

        <input type="radio" name="frequency" id="weekly" value="Weekly">
        <label for="weekly">Weekly</label>

        <input type="radio" name="frequency" id="monthly" value="Monthly">
        <label for="monthly">Monthly</label>
      </div>
    </fieldset>

    <label for="location">Select the Location You Listen to Music:</label>
    <select name="location" id="location" size="3">
      <option value="home">At Home</option>
      <option value="car">In the Car</option>
      <option value="gym">At the Gym</option>
      <option value="school">At School</option>
      <option value="anywhere">Anywhere</option>
    </select><br>

    <label for="musicdate">Choose the Date You Listen to Music:</label>
    <input type="date" name="musicdate" id="musicdate"><br>

    <label for="description">What role does music play in your life?</label>
    <textarea name="description" id="description" cols="60" rows="3"></textarea><br>

    <div class="buttons">
      <input type="submit" value="Submit">
      <input type="reset" value="Reset">
    </div>

  </form>

  <div class="back-link">
    <a href="index.html">Back to Home</a>
  </div>

  <footer>
    Jenna Pulley<br>
    japulley@mail.lipscomb.edu
  </footer>

</body>
</html>
