<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 20px;
    }

    h1 {
      text-align: center;
    }

    form {
      width: 700px;
      margin: 0 auto;
      background-color: #ffffff;
      padding: 20px;
      border: 1px solid #cccccc;
      border-radius: 8px;
    }

    label {
      display: inline-block;
      width: 140px;
      margin-bottom: 10px;
      vertical-align: top;
    }

    input, select {
      margin-bottom: 10px;
    }

    fieldset {
      margin-top: 15px;
      margin-bottom: 15px;
      padding: 15px;
      border: 1px solid #999999;
    }

    legend {
      font-weight: bold;
    }

    .radio-group label {
      width: auto;
      display: block;
      margin-left: 0;
    }

    .submit-area {
      text-align: center;
      margin-top: 20px;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: #003366;
      text-decoration: none;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>New Form</h1>

  <form method="post" action="https://webdevbasics.net/scripts/demo.php">

    <input type="hidden" name="userid" value="12345">

    <label for="username">Username:</label>
    <input type="text" name="username" id="username" maxlength="30"><br>

    <label for="pword">Password:</label>
    <input type="password" name="pword" id="pword"><br>

    <label>Favorite Day:</label>
    <div class="radio-group">
      <input type="radio" name="favday" id="monday" value="Monday">
      <label for="monday">Monday</label>

      <input type="radio" name="favday" id="tuesday" value="Tuesday">
      <label for="tuesday">Tuesday</label>

      <input type="radio" name="favday" id="friday" value="Friday">
      <label for="friday">Friday</label>

      <input type="radio" name="favday" id="sunday" value="Sunday">
      <label for="sunday">Sunday</label>
    </div>

    <br>

    <label for="social">Favorite Social Networking Site:</label>
    <select name="social" id="social">
      <option value="instagram">Instagram</option>
      <option value="tiktok">TikTok</option>
      <option value="snapchat">Snapchat</option>
      <option value="facebook">Facebook</option>
    </select>

    <fieldset>
      <legend>Shipping Address</legend>

      <label for="addressline1">Addressline1:</label>
      <input type="text" name="addressline1" id="addressline1"><br>

      <label for="addressline2">Addressline2:</label>
      <input type="text" name="addressline2" id="addressline2"><br>

      <label for="city">City:</label>
      <input type="text" name="city" id="city"><br>

      <label for="state">State:</label>
      <input type="text" name="state" id="state"><br>

      <label for="zip">Zip:</label>
      <input type="text" name="zip" id="zip"><br>
    </fieldset>

    <div class="submit-area">
      <input type="image" src="signup.gif" alt="Sign Up">
    </div>

  </form>

  <div class="back-link">
    <a href="index.html">Back to Home</a>
  </div>

</body>
</html>
