<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lighthouse Island Bistro</title>

<style>
body {
    font-family: Verdana, Arial, sans-serif;
    background-color: #00005D;
}

#wrapper {
    background-color: #b3c7e6;
    color: #000066;
    width: 80%;
    margin: auto;
    min-width: 850px;
}

#header {
    background-color: #869dc7;
    padding: 10px 10px 10px 155px;
    background-image: url(../../images/lighthouselogo.jpg);
    background-repeat: no-repeat;
}

#nav {
    float: right;
    width: 150px;
    font-weight: bold;
}

#nav a {
    display: block;
    padding: 20px;
    text-decoration: none;
    background-color: #b3c7e6;
    border-bottom: 1px solid white;
    color: white;
}

#nav a:hover {
    background-color: #eaeaea;
    color: #869dc7;
}

#content {
    background-color: white;
    padding: 20px;
    overflow: auto;
}

#floatright {
    float: right;
    margin: 10px;
}

#footer {
    font-size: 70%;
    text-align: center;
    padding: 10px;
    background-color: #869dc7;
}
</style>
</head>

<body>
<div id="wrapper">

<div id="header">
<h1>Lighthouse Island Bistro</h1>
</div>

<div id="nav">
<a href="#">Home</a>
<a href="#">Menu</a>
<a href="#">Map</a>
<a href="#">Contact</a>
</div>

<div id="content">

<img src="../../images/lighthouseisland.jpg"
     width="250"
     id="floatright"
     alt="Lighthouse Island">

<h2>Experience the Best Coffee on the Coast</h2>
<p>Fresh roasted coffee and homemade pastries daily.</p>

</div>

<div id="footer">
Copyright © 2026
</div>

</div>
</body>
</html>
